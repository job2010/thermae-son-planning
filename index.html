<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thermae Son Planning</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #17212b;
}

header {
    background: linear-gradient(135deg, #1261a0, #1687c7);
    color: white;
    padding: 28px 22px;
}

header h1 {
    margin: 0;
    font-size: 27px;
}

header p {
    margin: 7px 0 0;
    opacity: .9;
}

.container {
    width: 100%;
    max-width: 1050px;
    margin: auto;
    padding: 22px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 18px;
    box-shadow: 0 6px 25px rgba(20, 40, 70, .08);
}

.auth-card {
    max-width: 430px;
    margin: 60px auto;
}

h1, h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 6px;
    border: 1px solid #d6dee7;
    border-radius: 11px;
    font-size: 16px;
}

button {
    width: 100%;
    border: 0;
    border-radius: 11px;
    padding: 14px;
    margin-top: 12px;
    background: #1261a0;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.secondary {
    background: #e8eef4;
    color: #17212b;
}

.danger {
    background: #c62828;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 15px;
}

.hidden {
    display: none;
}

.error {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    background: #fdeaea;
    color: #a71919;
}

.success {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    background: #e8f7ed;
    color: #176b35;
}

.small {
    color: #6b7785;
    font-size: 14px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #6b7785;
    font-size: 14px;
}
</style>
</head>

<body>

<div id="loginPage">

    <div class="container">

        <div class="card auth-card">

            <h1>Thermae Son Planning</h1>

            <p class="small">
                Log in om je planning en uren te bekijken.
            </p>

            <label>E-mailadres</label>
            <input
                id="loginEmail"
                type="email"
                placeholder="naam@email.nl"
            >

            <label>Wachtwoord</label>
            <input
                id="loginPassword"
                type="password"
                placeholder="Wachtwoord"
            >

            <button id="loginButton">
                Inloggen
            </button>

            <button class="secondary" id="showRegisterButton">
                Account aanmaken
            </button>

            <div id="loginMessage"></div>

        </div>

    </div>

</div>


<div id="registerPage" class="hidden">

    <div class="container">

        <div class="card auth-card">

            <h1>Account aanmaken</h1>

            <p class="small">
                Vul je gegevens in om een account te maken.
            </p>

            <label>Naam</label>
            <input
                id="registerName"
                type="text"
                placeholder="Voor- en achternaam"
            >

            <label>E-mailadres</label>
            <input
                id="registerEmail"
                type="email"
                placeholder="naam@email.nl"
            >

            <label>Wachtwoord</label>
            <input
                id="registerPassword"
                type="password"
                placeholder="Minimaal 6 tekens"
            >

            <label>Leeftijd</label>
            <input
                id="registerAge"
                type="number"
                min="13"
                max="100"
                placeholder="Leeftijd"
            >

            <button id="registerButton">
                Account maken
            </button>

            <button class="secondary" id="backToLoginButton">
                ← Terug naar inloggen
            </button>

            <div id="registerMessage"></div>

        </div>

    </div>

</div>


<div id="app" class="hidden">

<header>
    <h1>Thermae Son Planning</h1>
    <p id="welcomeText">Welkom</p>
</header>

<main class="container">

    <div class="card">
        <h2>Overzicht</h2>
        <p id="userInfo"></p>
    </div>

    <div class="grid">

        <button>
            Mijn rooster
        </button>

        <button>
            Beschikbaarheid
        </button>

        <button>
            Mijn uren
        </button>

        <button>
            Urenoverzicht
        </button>

    </div>

    <div class="card">
        <button class="secondary" id="logoutButton">
            Uitloggen
        </button>
    </div>

</main>

<footer>
    Thermae Son Planning<br>
    Gemaakt door Job van der Kruijssen
</footer>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    setDoc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const firebaseConfig = {
    apiKey: "AIzaSyCLOZzmLUomH5hElTNNA0ORJC-3rQVOZc",
    authDomain: "thermae-son-planning.firebaseapp.com",
    projectId: "thermae-son-planning",
    storageBucket: "thermae-son-planning.firebasestorage.app",
    messagingSenderId: "677357840589",
    appId: "1:677357840589:web:28d927ada7e2b3205c2184",
    measurementId: "G-XEZN28H833"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const loginPage =
    document.getElementById("loginPage");

const registerPage =
    document.getElementById("registerPage");

const appPage =
    document.getElementById("app");


document
    .getElementById("showRegisterButton")
    .addEventListener("click", () => {

        loginPage.classList.add("hidden");

        registerPage.classList.remove("hidden");

    });


document
    .getElementById("backToLoginButton")
    .addEventListener("click", () => {

        registerPage.classList.add("hidden");

        loginPage.classList.remove("hidden");

    });


document
    .getElementById("loginButton")
    .addEventListener("click", async () => {

        const email =
            document.getElementById("loginEmail").value.trim();

        const password =
            document.getElementById("loginPassword").value;

        const message =
            document.getElementById("loginMessage");


        message.innerHTML = "";


        try {

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

        } catch (error) {

            message.innerHTML =
                `<div class="error">
                    Inloggen mislukt. Controleer je e-mailadres en wachtwoord.
                </div>`;

        }

    });


document
    .getElementById("registerButton")
    .addEventListener("click", async () => {

        const name =
            document.getElementById("registerName").value.trim();

        const email =
            document.getElementById("registerEmail").value.trim();

        const password =
            document.getElementById("registerPassword").value;

        const age =
            Number(
                document.getElementById("registerAge").value
            );

        const message =
            document.getElementById("registerMessage");


        message.innerHTML = "";


        if (!name || !email || !password || !age) {

            message.innerHTML =
                `<div class="error">
                    Vul alle velden in.
                </div>`;

            return;

        }


        if (password.length < 6) {

            message.innerHTML =
                `<div class="error">
                    Je wachtwoord moet minimaal 6 tekens bevatten.
                </div>`;

            return;

        }


        try {

            const credential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            await setDoc(
                doc(
                    db,
                    "users",
                    credential.user.uid
                ),
                {
                    naam: name,
                    email: email,
                    leeftijd: age,
                    rol: "medewerker",
                    aangemaaktOp:
                        new Date().toISOString()
                }
            );


            message.innerHTML =
                `<div class="success">
                    Account aangemaakt.
                </div>`;


        } catch (error) {

            message.innerHTML =
                `<div class="error">
                    Account maken mislukt: ${error.message}
                </div>`;

        }

    });


document
    .getElementById("logoutButton")
    .addEventListener("click", async () => {

        await signOut(auth);

    });


onAuthStateChanged(auth, async (user) => {

    if (!user) {

        loginPage.classList.remove("hidden");

        registerPage.classList.add("hidden");

        appPage.classList.add("hidden");

        return;

    }


    const userReference =
        doc(db, "users", user.uid);


    const userSnapshot =
        await getDoc(userReference);


    let userData = {};


    if (userSnapshot.exists()) {

        userData = userSnapshot.data();

    }


    loginPage.classList.add("hidden");

    registerPage.classList.add("hidden");

    appPage.classList.remove("hidden");


    document
        .getElementById("welcomeText")
        .textContent =
        "Welkom, " +
        (userData.naam || "medewerker");


    document
        .getElementById("userInfo")
        .textContent =
        "Ingelogd als " +
        (userData.rol || "medewerker");

});

</script>

</body>
</html>
